<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pokémon Team masters 2027 Seoul環境用</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#16253b;background:#f0f4fa}*{box-sizing:border-box}body{margin:0}.hero{background:linear-gradient(125deg,#112a51,#24548c);color:#fff;padding:22px max(16px,calc((100% - 1150px)/2))}.hero h1{font-size:clamp(20px,4vw,29px);margin:0 0 7px}.hero p{margin:0;opacity:.86;font-size:13px;line-height:1.6}.container{max-width:1150px;margin:0 auto;padding:16px}.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.slot{background:#fff;border:2px dashed #cbd7e8;border-radius:15px;min-height:165px;padding:13px;position:relative}.slot.filled{border:2px solid #2875c4}.slothead{font-weight:800;color:#58718f;font-size:13px;margin-bottom:9px}.slotbody{display:flex;gap:11px;align-items:center}.slot img{width:72px;height:99px;object-fit:contain}.slotname{font-size:16px;font-weight:800;overflow-wrap:anywhere}.slot .small{font-size:11px;color:#65748b;margin-top:5px}.remove{border:1px solid #e5b5ba;background:#fff0f0;color:#a32232;border-radius:7px;padding:6px 9px;margin-top:9px;cursor:pointer}.empty{font-size:14px;color:#8293aa;padding-top:27px}.panel{background:#fff;border-radius:14px;margin-top:14px;padding:15px;box-shadow:0 2px 12px #10243b0b}.panel h2{font-size:17px;margin:0 0 10px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:11px;font-weight:750;padding:5px 8px;border-radius:999px;background:#e8f1fa;color:#1e4d78}.chip.used{background:#ffe6df;color:#9e3a24}.status{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.stats{font-size:14px;font-weight:700}.reset{background:#eef3fa;color:#1c4778;border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:750}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}input[type=search]{flex:1;min-width:190px;padding:12px;border:1px solid #cad5e3;border-radius:9px;font-size:15px}label{font-size:13px;color:#52647d;display:flex;align-items:center;gap:5px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:9px}.deck{border:1px solid #d9e2ed;border-radius:11px;background:#fff;padding:10px;min-height:158px;display:flex;flex-direction:column;gap:7px;text-align:left;cursor:pointer;color:inherit}.deck:hover:not(:disabled){border-color:#2680ce;background:#f4faff}.deck:disabled{cursor:not-allowed;background:#f3f5f8;opacity:.58}.deck.selected{background:#e8f3ff;border:2px solid #2173bd}.decktop{display:flex;align-items:center;gap:9px}.thumbs{width:56px;min-width:56px;height:77px;display:flex;align-items:center;justify-content:center}.thumbs img{max-width:100%;max-height:76px;object-fit:contain}.thumbs.duo img{max-width:50%;max-height:68px}.tierbadge{display:inline-flex;width:max-content;font-size:10px;font-weight:850;border-radius:6px;padding:3px 7px;margin-bottom:5px}.tier1{background:#fce4e6;color:#a21e32}.tier2{background:#fff0cc;color:#885600}.tier3{background:#e4eefc;color:#215e9f}.tier4{background:#e9edf2;color:#586678}.deckname{font-weight:800;font-size:13px;overflow-wrap:anywhere}.sub{font-size:10px;color:#64748b;overflow-wrap:anywhere}.reason{font-size:11px;font-weight:700;color:#aa3a2d}.ok{font-size:11px;color:#25774c}.foot{font-size:12px;color:#62758c;line-height:1.7;margin:18px 0}.hint{background:#fff6dd;padding:10px 12px;border-radius:9px;font-size:12px;color:#76531b;margin-top:10px}.picker{margin-top:12px}.selectslot{display:flex;gap:7px;flex-wrap:wrap}.selectslot button{border:1px solid #c5d6e9;border-radius:8px;padding:8px 11px;background:white;color:#255582;font-weight:700;cursor:pointer}.selectslot button.active{background:#255e9a;color:#fff}.selectslot button:disabled{opacity:.35}.emptyresults{padding:25px;color:#62758c;text-align:center}.summary{font-size:13px;line-height:1.7;color:#36506e}
@media(max-width:680px){.slots{grid-template-columns:1fr}.slot{min-height:105px}.slot img{width:54px;height:73px}.empty{padding-top:7px}.slotbody{align-items:center}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.deck{padding:8px;min-height:145px}.decktop{gap:6px}.thumbs{width:45px;min-width:45px}.deckname{font-size:12px}.hero{padding:18px 14px}.container{padding:10px}.panel{padding:12px}}

.listbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:0 0 10px}.viewtoggle{display:flex;gap:4px;padding:3px;background:#eef3fa;border-radius:9px}.viewtoggle button{border:0;background:transparent;color:#49647f;border-radius:7px;padding:8px 10px;font-weight:750;cursor:pointer}.viewtoggle button.active{background:#fff;color:#17558e;box-shadow:0 1px 5px #1936571c}
.grid.listview{display:flex;flex-direction:column;gap:7px}.grid.listview .deck{min-height:0;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;row-gap:5px;align-items:center}.grid.listview .decktop{min-width:0;grid-row:1 / span 2}.grid.listview .thumbs{width:45px;min-width:45px;height:61px}.grid.listview .thumbs img{max-height:61px}.grid.listview .thumbs.duo img{max-height:55px}.grid.listview .deckname{font-size:14px;line-height:1.4}.grid.listview .sub{display:none}.grid.listview .tierbadge{margin:0 0 3px}.grid.listview .chips{grid-column:1;grid-row:3}.grid.listview .chip{font-size:10px;padding:3px 7px}.grid.listview .reason,.grid.listview .ok{grid-column:2;grid-row:1 / span 3;white-space:nowrap;font-size:11px}.grid.listview .deck:disabled{opacity:.55}
@media(max-width:480px){.grid.listview .deck{padding:9px;column-gap:5px}.grid.listview .deckname{font-size:13px}.grid.listview .thumbs{width:40px;min-width:40px}.grid.listview .reason,.grid.listview .ok{font-size:10px}.viewtoggle button{padding:7px}}
 .tiertabs{display:flex;gap:6px;overflow-x:auto;padding:2px 1px 10px;margin-top:12px;scrollbar-width:thin}.tiertabs button{flex:0 0 auto;white-space:nowrap;border:1px solid #cbd7e6;border-radius:999px;padding:9px 12px;background:#f5f8fc;color:#34516f;font-size:13px;font-weight:800;cursor:pointer}.tiertabs button.active{background:#245e9a;border-color:#245e9a;color:#fff}.tiertabs .tabcount{font-size:11px;opacity:.75;margin-left:4px}@media(max-width:480px){.tiertabs button{padding:9px 11px;font-size:12px}}

.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.deck{min-height:162px}.thumbs{width:82px;min-width:82px;height:103px}.thumbs img{max-height:102px}.thumbs.duo img{max-height:100px}.deckname{font-size:14px;line-height:1.45}.decktop{align-items:flex-start}.chip{font-size:11px}
.slotthumbs{display:flex;align-items:center;justify-content:center;gap:2px;width:100px;min-width:100px;height:105px}.slotthumbs img{max-width:100%;max-height:105px;object-fit:contain}.slotthumbs.duo img{max-width:49%}
.pagination{display:flex;justify-content:center;align-items:center;gap:14px;margin:20px 0 5px;font-size:13px;font-weight:750}.pagination button{border:1px solid #b7c9dd;border-radius:9px;padding:10px 16px;background:#fff;color:#1f527f;font-weight:750;cursor:pointer}.pagination button:disabled{opacity:.35;cursor:not-allowed}
.sitefooter{background:#152f53;color:#e5effc;text-align:center;padding:22px 14px;margin-top:26px;font-size:13px;font-weight:700}.sitefooter small{display:block;font-size:11px;opacity:.7;font-weight:400;margin-top:7px}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.thumbs{width:57px;min-width:57px;height:84px}.thumbs img,.thumbs.duo img{max-height:82px}.slotthumbs{width:76px;min-width:76px;height:82px}.slotthumbs img{max-height:82px}}
@media(max-width:480px){.deck{padding:9px;min-height:165px}.thumbs{width:54px;min-width:54px;height:80px}.deckname{font-size:12px}.decktop{gap:7px}.thumbs.duo{width:76px;min-width:76px}.thumbs.duo img{max-height:72px}.slotthumbs{width:76px;min-width:76px}}
</style></head><body><header class="hero"><h1>Pokémon Team masters 2027 Seoul環境用</h1></header><main class="container"><div class="slots" id="slots"></div><section class="panel"><div class="status"><div class="stats" id="stats"></div><button class="reset" id="reset">選択をすべて解除</button></div><div id="summary" class="summary"></div><div class="chips" id="used"></div></section><section class="panel"><h2>デッキを選ぶ</h2><div class="selectslot" id="pickslot"></div><div class="controls"><input type="search" id="search" placeholder="デッキ名で検索（例：ドラパ、ルカリオ）"><label><input type="checkbox" id="onlyok" checked> 選択可能なデッキのみ表示</label></div><div class="tiertabs" id="tiertabs" role="group" aria-label="Tierで絞り込む"></div><div class="listbar"><div class="stats" id="resultcount"></div></div><div class="grid" id="decks"></div><nav class="pagination" id="pagination" aria-label="デッキ一覧のページ切り替え"></nav></section></main><footer class="sitefooter"><div>Pokémon Team masters 2027 Seoul環境用</div><small>© 2026 Fan-made deck selection tool · Unofficial</small></footer><script>
let DATA={groups:[],decks:[]};
const DATA_URL='decks.json';
let systemOrder=DATA.groups.filter(g=>g.name!=='被りなし').map(g=>g.name);
let selected=[null,null,null], target=0;let activeTier='all',currentPage=1;const PAGE_SIZE=30;
const $=id=>document.getElementById(id);
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function usedSystems(except=-1){return new Set(selected.flatMap((d,i)=>i===except||!d?[]:d.systems))}
function clash(d,slot){let used=usedSystems(slot);return d.systems.filter(s=>used.has(s))}
function freeSlot(){let n=selected.findIndex(x=>!x);return n<0?0:n}
function pick(d){let slot=target;if(selected[slot]?.id===d.id)return;let already=selected.findIndex((x,i)=>i!==slot&&x?.id===d.id);if(already>=0)return;if(clash(d,slot).length)return;selected[slot]=d;target=freeSlot();render()}
function clearSlot(i){selected[i]=null;target=i;render()}
function render(){let used=usedSystems();$('slots').innerHTML=selected.map((d,i)=>`<div class="slot ${d?'filled':''}"><div class="slothead">${i+1}デッキ目</div>${d?`<div class="slotbody"><div class="slotthumbs ${d.images.length>1?'duo':''}">${d.images.map(url=>`<img src="${escapeHtml(url)}" alt="">`).join('')}</div><div><div class="slotname">${escapeHtml(d.name)}</div><div class="small">${d.systems.length?escapeHtml(d.systems.join(' / ')):'指定システム被りなし'}</div><button class="remove" data-clear="${i}">このデッキを解除</button></div></div>`:`<div class="empty">まだ選択されていません</div>`}</div>`).join('');
$('slots').querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>clearSlot(+b.dataset.clear));
$('pickslot').innerHTML=selected.map((d,i)=>`<button class="${target===i?'active':''}" data-slot="${i}">${i+1}デッキ目 ${d?'（変更）':''}</button>`).join('');$('pickslot').querySelectorAll('button').forEach(b=>b.onclick=()=>{target=+b.dataset.slot;render()});
$('stats').textContent=`選択中：${selected.filter(Boolean).length} / 3 デッキ`;
$('summary').textContent=selected.every(Boolean)?'✓ 3デッキのシステムポケモン重複なし。組み合わせが完成しました。':'次に選ぶデッキは、使用済みシステムポケモンと重複しないものだけ選択できます。';
$('used').innerHTML=systemOrder.map(s=>`<span class="chip ${used.has(s)?'used':''}">${escapeHtml(s)} ${used.has(s)?'使用中':'未使用'}</span>`).join('');renderDecks()}
function renderDecks(){
 const q=$('search').value.trim().toLocaleLowerCase(),only=$('onlyok').checked;
 const tabs=[['all','All'],['1','Tier 1'],['2','Tier 2'],['3','Tier 3'],['4','Tier外']];
 $('tiertabs').innerHTML=tabs.map(([id,label])=>{const count=DATA.decks.filter(d=>id==='all'||String(d.tier||4)===id).length;return `<button type="button" data-tier="${id}" class="${activeTier===id?'active':''}" aria-pressed="${activeTier===id}">${label}<span class="tabcount">${count}</span></button>`}).join('');
 $('tiertabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{activeTier=b.dataset.tier;currentPage=1;renderDecks()});
 let candidates=DATA.decks.filter(d=>(activeTier==='all'||String(d.tier||4)===activeTier)&&(`${d.name} ${d.originalName||''} ${d.card||''}`).toLocaleLowerCase().includes(q));
 let visible=candidates.filter(d=>{let taken=selected.some((x,i)=>i!==target&&x?.id===d.id);return !only||(!taken&&!clash(d,target).length)});
 const pages=Math.max(1,Math.ceil(visible.length/PAGE_SIZE));currentPage=Math.max(1,Math.min(currentPage,pages));
 const paged=visible.slice((currentPage-1)*PAGE_SIZE,currentPage*PAGE_SIZE);
 $('resultcount').textContent=`表示 ${visible.length?((currentPage-1)*PAGE_SIZE+1):0}〜${Math.min(currentPage*PAGE_SIZE,visible.length)} 件 / 該当 ${visible.length} 件（全 ${DATA.decks.length} 種類）`;
 $('decks').innerHTML=paged.map(d=>{let conflicts=clash(d,target),taken=selected.some((x,i)=>i!==target&&x?.id===d.id),isCurrent=selected[target]?.id===d.id,blocked=conflicts.length||taken;let why=taken?'他の枠で選択済み':conflicts.length?'重複：'+conflicts.join('・'):isCurrent?'この枠で選択中':'選択可能';return `<button class="deck ${isCurrent?'selected':''}" data-id="${escapeHtml(d.id)}" ${blocked?'disabled':''}><div class="decktop"><div class="thumbs ${d.images.length>1?'duo':''}">${d.images.map(url=>`<img src="${escapeHtml(url)}" loading="lazy" alt="">`).join('')}</div><div><div class="tierbadge tier${d.tier||4}">${d.tier===4?'Tier外':'Tier '+d.tier}</div><div class="deckname">${escapeHtml(d.name)}</div></div></div><div class="chips">${d.systems.length?d.systems.map(s=>`<span class="chip">${escapeHtml(s)}</span>`).join(''):'<span class="chip">被りなし</span>'}</div><div class="${blocked?'reason':'ok'}">${escapeHtml(why)}</div></button>`}).join('')||'<div class="emptyresults">該当するデッキはありません。</div>';
 $('decks').querySelectorAll('button[data-id]').forEach(b=>b.onclick=()=>pick(DATA.decks.find(d=>d.id===b.dataset.id)));
 $('pagination').innerHTML=pages<=1?'':`<button data-page="${currentPage-1}" ${currentPage===1?'disabled':''}>‹ 前へ</button><span>${currentPage} / ${pages} ページ</span><button data-page="${currentPage+1}" ${currentPage===pages?'disabled':''}>次へ ›</button>`;
 $('pagination').querySelectorAll('button[data-page]').forEach(b=>b.onclick=()=>{currentPage=+b.dataset.page;renderDecks();$('tiertabs').scrollIntoView({behavior:'smooth',block:'start'})});
}
$('search').oninput=()=>{currentPage=1;renderDecks()};$('onlyok').onchange=()=>{currentPage=1;renderDecks()};$('reset').onclick=()=>{selected=[null,null,null];target=0;render()};async function loadData(){
 try {
  const response=await fetch(DATA_URL,{cache:'no-store'});
  if(!response.ok)throw new Error('HTTP '+response.status);
  const incoming=await response.json();
  if(!Array.isArray(incoming.groups)||!Array.isArray(incoming.decks))throw new Error('データ形式が不正です');
  DATA=incoming;
  DATA.decks.sort((a,b)=>(a.tier||4)-(b.tier||4));
  systemOrder=DATA.groups.filter(g=>g.name!=='被りなし').map(g=>g.name);
  render();
 }catch(err){
  $('resultcount').textContent='データの読み込みに失敗しました。ページを再読み込みしてください。';
  $('summary').textContent='読み込みエラー：'+err.message;
 }
}
loadData();
</script></body></html>
