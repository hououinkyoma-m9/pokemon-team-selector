const uiText={ja:{title:'Pokémon Team masters 2027 Seoul環境',subtitle:'デッキ選択ツール',pick:'デッキを選ぶ',reset:'選択をすべて解除',search:'デッキ名で検索（例：ドラパ、ルカリオ）',only:'選択可能なデッキのみ表示',slot:i=>`${i}デッキ目`,empty:'まだ選択されていません',remove:'このデッキを解除',change:'（変更）',stats:n=>`選択中：${n} / 3 デッキ`,complete:'✓ 3デッキのシステムポケモン重複なし。組み合わせが完成しました。',incomplete:'次に選ぶデッキは、使用済みシステムポケモンと重複しないものだけ選択できます。',used:'使用中',unused:'未使用',outside:'Tier外',count:(a,b,n,total)=>`表示 ${a}〜${b} 件 / 該当 ${n} 件（全 ${total} 種類）`,taken:'他の枠で選択済み',clash:'重複：',current:'この枠で選択中',available:'選択可能',none:'該当するデッキはありません。',prev:'‹ 前へ',next:'次へ ›',page:(n,total)=>`${n} / ${total} ページ`,error:'データの読み込みに失敗しました。ページを再読み込みしてください。',badData:'データ形式が不正です',loadError:'読み込みエラー：'},en:{title:'Pokémon Team Masters 2027 · Seoul Meta',subtitle:'Team Deck Selector',pick:'Choose a Deck',reset:'Clear All Selections',search:'Search decks (e.g., Dragapult, Lucario)',only:'Show available decks only',slot:i=>`Deck ${i}`,empty:'Not selected yet',remove:'Remove this deck',change:'(change)',stats:n=>`Selected: ${n} / 3 decks`,complete:'✓ All 3 decks selected with no shared system Pokémon.',incomplete:'Only decks with no overlapping system Pokémon can be selected.',used:'In use',unused:'Available',outside:'Unranked',count:(a,b,n,total)=>`Showing ${a}–${b} of ${n} matches (${total} total)`,taken:'Selected in another slot',clash:'Overlap: ',current:'Selected in this slot',available:'Selectable',none:'No matching decks.',prev:'‹ Previous',next:'Next ›',page:(n,total)=>`Page ${n} / ${total}`,error:'Failed to load deck data. Please refresh.',badData:'Invalid deck data format',loadError:'Load error: '}};
let language='ja';const t=()=>uiText[language];

const localizedSystem=s=>language==='en'?translatePart(s):s;
function applyLanguage(){document.documentElement.lang=language;$('heroTitle').textContent=t().title;$('heroSubtitle').textContent=t().subtitle;$('pickHeading').textContent=t().pick;$('reset').textContent=t().reset;$('search').placeholder=t().search;$('onlyokLabel').textContent=t().only;$('footerTitle').textContent=t().title;document.querySelectorAll('[data-lang]').forEach(b=>{b.classList.toggle('active',b.dataset.lang===language);b.setAttribute('aria-pressed',String(b.dataset.lang===language))});render()}
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{if(language===b.dataset.lang)return;language=b.dataset.lang;currentPage=1;applyLanguage()}));
const DATA_URL='decks.json';
let systemOrder=[];
let selected=[null,null,null], target=0;let activeTier='all',currentPage=1;const PAGE_SIZE=30;
const $=id=>document.getElementById(id);
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Japanese alphabetical order (五十音順), with ex tags first.
const jaCollator=new Intl.Collator('ja',{sensitivity:'base',numeric:true});
const compareJa=(a,b)=>jaCollator.compare(a,b);
const isExTag=s=>/ex$/i.test(s);
const compareSystems=(a,b)=>Number(isExTag(b))-Number(isExTag(a))||compareJa(a,b);
const sortedSystems=systems=>[...systems].sort(compareSystems);
const displayDeckName=name=>localizedName(name).split('&').map((part,i)=>(i?'&':'')+escapeHtml(part)).join('<br>');
const primaryName=name=>name.split('&')[0];
const componentCount=name=>name.split('&').length;
function compareDecks(a,b){
 const tier=(a.tier||4)-(b.tier||4);
 if(tier)return tier;
 const family=compareJa(primaryName(a.name),primaryName(b.name));
 if(family)return family;
 // In the same deck family: single-card builds first, then two-card builds.
 const parts=componentCount(a.name)-componentCount(b.name);
 if(parts)return parts;
 // More system tags first within the same deck build.
 const deck=compareJa(a.name,b.name);
 if(deck)return deck;
 const tags=b.systems.length-a.systems.length;
 if(tags)return tags;
 const tagNames=compareJa(sortedSystems(a.systems).join('/'),sortedSystems(b.systems).join('/'));
 if(tagNames)return tagNames;
 return compareJa(a.id,b.id);
}

function usedSystems(except=-1){return new Set(selected.flatMap((d,i)=>i===except||!d?[]:d.systems))}
function clash(d,slot){let used=usedSystems(slot);return d.systems.filter(s=>used.has(s))}

function clearSlot(i){selected[i]=null;target=i;render()}
function render(){let used=usedSystems();$('slots').innerHTML=selected.map((d,i)=>`<div class="slot ${d?'filled':''}"><div class="slothead">${t().slot(i+1)}</div>${d?`<div class="slotbody"><div class="slotthumbs ${d.images.length>1?'duo':''}">${d.images.map(url=>`<img src="${escapeHtml(url)}" alt="">`).join('')}</div><div><div class="slotname">${displayDeckName(d.name)}</div><div class="small">${d.systems.length?escapeHtml(sortedSystems(d.systems).map(localizedSystem).join(' / ')) : ''}</div><button class="remove" data-clear="${i}">${t().remove}</button></div></div>`:`<div class="empty">${t().empty}</div>`}</div>`).join('');
$('slots').querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>clearSlot(+b.dataset.clear));

$('stats').textContent=t().stats(selected.filter(Boolean).length);
$('summary').textContent=selected.every(Boolean)?t().complete:t().incomplete;
$('used').innerHTML=systemOrder.map(s=>`<span class="chip ${used.has(s)?'used':''}">${escapeHtml(localizedSystem(s))} ${used.has(s)?t().used:t().unused}</span>`).join('');renderDecks()}
function renderDecks(){
 const q=$('search').value.trim().toLocaleLowerCase(),only=$('onlyok').checked;
 const tabs=[['all','All'],['1','Tier 1'],['2','Tier 2'],['3','Tier 3'],['4','Tier外']];
 $('tiertabs').innerHTML=tabs.map(([id,label])=>{const count=DATA.decks.filter(d=>id==='all'||String(d.tier||4)===id).length;return `<button type="button" data-tier="${id}" class="${activeTier===id?'active':''}" aria-pressed="${activeTier===id}">${label}<span class="tabcount">${count}</span></button>`}).join('');
 $('tiertabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{activeTier=b.dataset.tier;currentPage=1;renderDecks()});
 let candidates=DATA.decks.filter(d=>(activeTier==='all'||String(d.tier||4)===activeTier)&&(`${d.name} ${d.originalName||''} ${d.card||''} ${localizedName(d.name)} ${d.systems.map(localizedSystem).join(' ')}`).toLocaleLowerCase().includes(q));
 let visible=candidates.filter(d=>{let taken=selected.some((x,i)=>i!==target&&x?.id===d.id);return !only||(!taken&&!clash(d,target).length)});
 const pages=Math.max(1,Math.ceil(visible.length/PAGE_SIZE));currentPage=Math.max(1,Math.min(currentPage,pages));
