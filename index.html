Object.assign(TEXT,MORE_TEXT);
const collator=new Intl.Collator('ja',{sensitivity:'base',numeric:true});
const cmp=(a,b)=>collator.compare(a,b);
const exFirst=(a,b)=>Number(/ex$/i.test(b))-Number(/ex$/i.test(a))||cmp(a,b);
const sortedTags=a=>[...a].sort(exFirst);
const deckParts=n=>n.split('&');
function compareDecks(a,b){return (a.tier||4)-(b.tier||4)||cmp(deckParts(a.name)[0],deckParts(b.name)[0])||deckParts(a.name).length-deckParts(b.name).length||cmp(a.name,b.name)||b.systems.length-a.systems.length||cmp(sortedTags(a.systems).join('/'),sortedTags(b.systems).join('/'))||cmp(a.id,b.id)}
let data=null,language='ja',chosen=[null,null,null],slot=0,tier='all',page=1,systemFilters=new Set();const PAGE_SIZE=30;
const t=()=>TEXT[language]||TEXT.en;
const local=s=>language==='ja'?s:(NAMES[language]?.[s]||EN[s]||s);
const deckName=n=>deckParts(n).map(local).map((part,i)=>(i?'&amp;':'')+esc(part)).join('<br>');
const used=except=>new Set(chosen.flatMap((d,i)=>i===except||!d?[]:d.systems));
const overlaps=(d,index)=>d.systems.filter(s=>used(index).has(s));
const getNextSlot=()=>{const n=chosen.findIndex(d=>!d);return n<0?slot:n};
function selectDeck(d){if(chosen.some((x,i)=>i!==slot&&x?.id===d.id)||overlaps(d,slot).length)return;chosen[slot]=d;slot=getNextSlot();render();}
function clearSlot(i){chosen[i]=null;slot=i;render();}
function setLanguage(lang){language=TEXT[lang]?lang:'en';document.documentElement.lang=language;$('languageSelect').value=language;$('pageTitle').textContent=t().title;$('pageSubtitle').textContent=t().subtitle;$('teamHeading').textContent=t().team;$('systemsHeading').textContent=t().systems;$('systemHint').textContent=t().systemHint;$('freeLabel').textContent=t().free;$('busyLabel').textContent=t().busy;$('chooseHeading').textContent=t().choose;$('reset').textContent=t().reset;$('slotInstruction').textContent=t().instruction;$('search').placeholder=t().search;$('search').setAttribute('aria-label',t().search);$('clearSearch').setAttribute('aria-label',t().clearSearch);$('availableLabel').textContent=t().availableOnly;render();}
function render(){if(!data)return;const count=chosen.filter(Boolean).length;$('progress').textContent=`${count} / 3`;$('reset').hidden=!count;
$('slots').innerHTML=chosen.map((d,i)=>`<div class="slot ${slot===i?'is-target':''} ${d?'is-filled':''}" data-slot="${i}"><div class="slot-top"><span class="slot-index">${esc(t().slot(i+1))}</span>${slot===i?`<span class="slot-edit">${esc(t().edit)}</span>`:''}</div>${d?`<div class="slot-art ${d.images.length>1?'two':''}">${d.images.map(url=>`<img src="${esc(url)}" alt="" loading="lazy">`).join('')}</div><div class="slot-name">${deckName(d.name)}</div>${d.systems.length?`<div class="slot-tags">${esc(sortedTags(d.systems).map(local).join(' · '))}</div>`:''}<button type="button" class="slot-remove" data-remove="${i}" aria-label="${esc(t().remove)} ${esc(t().slot(i+1))}">${esc(t().remove)}</button>`:`<div class="slot-empty">${esc(t().empty)}</div>`}</div>`).join('');
$('slots').querySelectorAll('.slot').forEach(el=>el.addEventListener('click',event=>{if(event.target.closest('[data-remove]'))return;slot=Number(el.dataset.slot);render();}));$('slots').querySelectorAll('[data-remove]').forEach(el=>el.addEventListener('click',event=>{event.stopPropagation();clearSlot(Number(el.dataset.remove));}));
$('slotChoices').innerHTML=chosen.map((d,i)=>`<button type="button" data-slot="${i}" class="${slot===i?'active':''}" aria-pressed="${slot===i}">${esc(t().slot(i+1))}${d?' ✓':''}</button>`).join('');$('slotChoices').querySelectorAll('button').forEach(el=>el.addEventListener('click',()=>{slot=Number(el.dataset.slot);render();}));
const occupied=used(-1);$('systems').innerHTML=data.groups.filter(g=>g.name!=='被りなし').map(g=>g.name).sort(exFirst).map(s=>`<button type="button" class="system-tag system-filter ${occupied.has(s)?'busy':''}" data-system="${esc(s)}" aria-pressed="${systemFilters.has(s)}" title="${esc(local(s))} — ${esc(occupied.has(s)?t().busy:t().free)}">${esc(local(s))}</button>`).join('');$('systems').querySelectorAll('[data-system]').forEach(b=>b.addEventListener('click',()=>{const key=b.dataset.system;if(systemFilters.has(key))systemFilters.delete(key);else systemFilters.add(key);page=1;render();}));const note=$('activeFilterNote');note.hidden=systemFilters.size===0;note.innerHTML=systemFilters.size?`${esc(t().filterCount(systemFilters.size))}<button type="button" id="clearSystemFilters">${esc(t().clearFilters)}</button>`:'';if(systemFilters.size)$('clearSystemFilters').addEventListener('click',()=>{systemFilters.clear();page=1;render();});renderDecks();}
function renderDecks(){if(!data)return;const q=$('search').value.trim().toLocaleLowerCase();const only=$('availableOnly').checked;const tabs=[['all','All'],['1','Tier 1'],['2','Tier 2'],['3','Tier 3'],['4',t().unranked]];
$('tierTabs').innerHTML=tabs.map(([key,label])=>`<button type="button" role="tab" data-tier="${key}" aria-selected="${tier===key}">${esc(label)}<span class="tab-count">${data.decks.filter(d=>key==='all'||String(d.tier||4)===key).length}</span></button>`).join('');$('tierTabs').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{tier=b.dataset.tier;page=1;renderDecks();}));
const matches=data.decks.filter(d=>(tier==='all'||String(d.tier||4)===tier)&&[...systemFilters].every(system=>d.systems.includes(system))&&[d.name,d.originalName||'',d.card||'',...Object.keys(TEXT).map(lang=>deckParts(d.name).map(part=>lang==='ja'?part:(NAMES[lang]?.[part]||EN[part]||part)).join(' ')),...d.systems,...Object.keys(TEXT).flatMap(lang=>d.systems.map(x=>lang==='ja'?x:(NAMES[lang]?.[x]||EN[x]||x)))].join(' ').toLocaleLowerCase().includes(q));
const filtered=matches.filter(d=>!only||(!chosen.some((x,i)=>i!==slot&&x?.id===d.id)&&!overlaps(d,slot).length));const maxPage=Math.max(1,Math.ceil(filtered.length/PAGE_SIZE));page=Math.max(1,Math.min(page,maxPage));const items=filtered.slice((page-1)*PAGE_SIZE,page*PAGE_SIZE);
$('resultCount').textContent=t().results(filtered.length,data.decks.length);
$('deckGrid').innerHTML=items.length?items.map(d=>{const already=chosen.some((x,i)=>i!==slot&&x?.id===d.id),conflict=overlaps(d,slot).length>0,current=chosen[slot]?.id===d.id,blocked=already||conflict;return `<button type="button" class="deck ${current?'is-current':''}" data-id="${esc(d.id)}" ${blocked?'disabled':''} aria-label="${esc(deckParts(d.name).map(local).join(' & '))}, ${esc(blocked?(already?t().already:t().blocked):current?t().selected:t().available)}"><div class="deck-art ${d.images.length>1?'two':''}">${d.images.map(url=>`<img src="${esc(url)}" alt="" loading="lazy">`).join('')}</div><div class="deck-label"><span class="tier tier-${d.tier||4}">${esc(d.tier===4?t().unranked:'Tier '+d.tier)}</span></div><div class="deck-name">${deckName(d.name)}</div>${d.systems.length?`<div class="deck-tags">${sortedTags(d.systems).map(s=>`<span class="system-tag">${esc(local(s))}</span>`).join('')}</div>`:''}<div class="deck-state ${blocked?'blocked':''}">${esc(blocked?(already?t().already:t().blocked):current?t().selected:t().available)}</div></button>`}).join(''):`<div class="empty-results">${esc(t().noResults)}</div>`;
$('deckGrid').querySelectorAll('[data-id]').forEach(b=>b.addEventListener('click',()=>{const d=data.decks.find(x=>x.id===b.dataset.id);if(d)selectDeck(d)}));
$('pager').innerHTML=maxPage<=1?'':`<button type="button" data-page="${page-1}" ${page===1?'disabled':''}>${esc(t().prev)}</button><span>${esc(t().page(page,maxPage))}</span><button type="button" data-page="${page+1}" ${page===maxPage?'disabled':''}>${esc(t().next)}</button>`;
$('pager').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{page=Number(b.dataset.page);renderDecks();$('tierTabs').scrollIntoView({block:'start',behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});}));}
$('search').addEventListener('input',()=>{page=1;$('clearSearch').hidden=!$('search').value;renderDecks();});$('clearSearch').addEventListener('click',()=>{$('search').value='';$('clearSearch').hidden=true;page=1;renderDecks();$('search').focus();});$('availableOnly').addEventListener('change',()=>{page=1;renderDecks();});$('reset').addEventListener('click',()=>{if(chosen.some(Boolean)&&confirm(t().confirm)){chosen=[null,null,null];slot=0;page=1;render();}});$('languageSelect').addEventListener('change',e=>setLanguage(e.target.value));
async function init(){try{const res=await fetch('decks.json',{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const d=await res.json();if(!Array.isArray(d.groups)||!Array.isArray(d.decks)||d.decks.some(x=>!x.id||!Array.isArray(x.systems)||!Array.isArray(x.images)))throw Error('Invalid data');d.decks.sort(compareDecks);data=d;render();}catch(err){console.error('Deck data load failed',err);$('error').hidden=false;$('error').textContent=t().error;$('resultCount').textContent='';}}
setLanguage('ja');$('resultCount').textContent=t().loading;init();
