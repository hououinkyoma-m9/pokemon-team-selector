const filtered=matches.filter(d=>!only||(!chosen.some((x,i)=>i!==slot&&x?.id===d.id)&&!overlaps(d,slot).length));const maxPage=Math.max(1,Math.ceil(filtered.length/PAGE_SIZE));page=Math.max(1,Math.min(page,maxPage));const items=filtered.slice((page-1)*PAGE_SIZE,page*PAGE_SIZE);
$('resultCount').textContent=t().results(filtered.length,data.decks.length);
$('deckGrid').innerHTML=items.length?items.map(d=>{const already=chosen.some((x,i)=>i!==slot&&x?.id===d.id),conflict=overlaps(d,slot).length>0,current=chosen[slot]?.id===d.id,blocked=already||conflict;return `<button type="button" class="deck ${current?'is-current':''}" data-id="${esc(d.id)}" ${blocked?'disabled':''} aria-label="${esc(deckParts(d.name).map(local).join(' & '))}, ${esc(blocked?(already?t().already:t().blocked):current?t().selected:t().available)}"><div class="deck-art ${d.images.length>1?'two':''}">${d.images.map(url=>`<img src="${esc(url)}" alt="" loading="lazy">`).join('')}</div><div class="deck-label"><span class="tier tier-${d.tier||4}">${esc(d.tier===4?t().unranked:'Tier '+d.tier)}</span></div><div class="deck-name">${deckName(d.name)}</div>${d.systems.length?`<div class="deck-tags">${sortedTags(d.systems).map(s=>`<span class="system-tag">${esc(local(s))}</span>`).join('')}</div>`:''}<div class="deck-state ${blocked?'blocked':''}">${esc(blocked?(already?t().already:t().blocked):current?t().selected:t().available)}</div></button>`}).join(''):`<div class="empty-results">${esc(t().noResults)}</div>`;
$('deckGrid').querySelectorAll('[data-id]').forEach(b=>b.addEventListener('click',()=>{const d=data.decks.find(x=>x.id===b.dataset.id);if(d)selectDeck(d)}));
$('pager').innerHTML=maxPage<=1?'':`<button type="button" data-page="${page-1}" ${page===1?'disabled':''}>${esc(t().prev)}</button><span>${esc(t().page(page,maxPage))}</span><button type="button" data-page="${page+1}" ${page===maxPage?'disabled':''}>${esc(t().next)}</button>`;
$('pager').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{page=Number(b.dataset.page);renderDecks();$('tierTabs').scrollIntoView({block:'start',behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});}));}
$('search').addEventListener('input',()=>{page=1;$('clearSearch').hidden=!$('search').value;renderDecks();});$('clearSearch').addEventListener('click',()=>{$('search').value='';$('clearSearch').hidden=true;page=1;renderDecks();$('search').focus();});$('availableOnly').addEventListener('change',()=>{page=1;renderDecks();});$('reset').addEventListener('click',()=>{if(chosen.some(Boolean)&&confirm(t().confirm)){chosen=[null,null,null];slot=0;page=1;render();}});document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{if(language!==b.dataset.lang)setLanguage(b.dataset.lang);}));
async function init(){try{const res=await fetch('decks.json',{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const d=await res.json();if(!Array.isArray(d.groups)||!Array.isArray(d.decks)||d.decks.some(x=>!x.id||!Array.isArray(x.systems)||!Array.isArray(x.images)))throw Error('Invalid data');d.decks.sort(compareDecks);data=d;render();}catch(err){console.error('Deck data load failed',err);$('error').hidden=false;$('error').textContent=t().error;$('resultCount').textContent='';}}
setLanguage('ja');$('resultCount').textContent=t().loading;init();
</script>
</body></html>
